services:
  - type: web
    name: massing-studio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: AI_HOURLY_LIMIT
        value: "60"
